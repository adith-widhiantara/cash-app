services:
  app:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - TZ=Asia/Jakarta
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - DATABASE_URL=file:/app/data/dev.db
    restart: unless-stopped

volumes:
  node_modules:
  next_cache:
